# DOM web 容器内 nginx：纯静态 SPA + 同源反代（生产与本地一致）。
# /v1             -> api 服务（HTTP）
# /v1/realtime    -> realtime 服务（WebSocket）
# /public-share   -> realtime 服务匿名分享（WebSocket）
# 静态资源走 SPA fallback；/healthz 供容器健康检查。

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# 容器内 Docker DNS（127.0.0.11）做动态 upstream 解析，服务重建后不失效。
	resolver 127.0.0.11 valid=30s ipv6=off;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# WebSocket：realtime 网关
	location = /v1/realtime {
		set $realtime_upstream realtime:8765;
		proxy_pass http://$realtime_upstream;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# 长连接实时通道，禁止默认短超时断开
		proxy_read_timeout 24h;
		proxy_send_timeout 24h;
		proxy_buffering off;
	}

	# WebSocket：匿名分享通道
	location = /public-share {
		set $realtime_upstream realtime:8765;
		proxy_pass http://$realtime_upstream;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 24h;
		proxy_send_timeout 24h;
		proxy_buffering off;
	}

	# API（含大文件上传）
	location /v1/ {
		set $api_upstream api:8000;
		proxy_pass http://$api_upstream;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		client_max_body_size 100m;
	}

	# SPA fallback
	location / {
		try_files $uri $uri/ /index.html;
	}
}