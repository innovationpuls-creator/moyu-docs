[project]
name = "maintenance-worker"
version = "0.1.0"
description = "DOM maintenance task worker."
requires-python = ">=3.12"
dependencies = [
    "app-core",
    "app-infrastructure",
    "task-runtime",
    "httpx>=0.27",
]

[tool.uv.sources]
app-core = { workspace = true }
app-infrastructure = { workspace = true }
task-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers/maintenance"]
