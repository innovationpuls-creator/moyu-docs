# 墨屿单机生产部署（阿里云 ECS Ubuntu 24.04）。
# 编排决策见 docs/adr/0057-aliyun-single-node-deployment.md；部署手册见
# docs/runbooks/aliyun-ubuntu-24.04.md。
#
# 首次部署：在 /opt/moyu 先运行 scripts/deploy-aliyun/initialize-env.sh <公网IP>
# 生成本地 .env（密钥不入仓库），再执行：
#   docker compose --parallel 1 up -d --build
# 发布端口仅 80/443（入口 nginx）；数据库/队列/对象存储不出现在公网。
name: dom

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:? 缺少 POSTGRES_USER：先运行 scripts/deploy-aliyun/initialize-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-dom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? 缺少 POSTGRES_PASSWORD：先运行 scripts/deploy-aliyun/initialize-env.sh}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # postgres 18 官方镜像数据在 /var/lib/postgresql/<major>/docker，挂父目录兼容升级。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-dom}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  valkey:
    # 缓存与会话（doc 26 §35-§36）：非 Source of Truth，允许无持久化重建。
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  nats:
    # 队列 / 事件总线（doc 26 §31-§32）；JetStream 数据落盘卷。
    image: nats:2-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  minio:
    # S3 兼容对象存储（doc 26 §39-§41）：附件 / 导入导出暂存。
    # MinIO 官方 Docker 镜像自 2025-10 起停止免费分发（Docker Hub 仓库已删除），
    # 采用 Chainguard 基于官方源码构建的镜像（digest 固定，可平替 OSS）。
    image: cgr.dev/chainguard/minio@sha256:3d9014eab095d4f2a12fbac3573546866f80187b7b2de1a8c6a2b1fda2e55ba0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:? 缺少 MINIO_ROOT_USER：先运行 scripts/deploy-aliyun/initialize-env.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:? 缺少 MINIO_ROOT_PASSWORD：先运行 scripts/deploy-aliyun/initialize-env.sh}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    logging: *default-logging

  # Chainguard MinIO 为 distroless（无 shell/curl），健康检查用 sidecar 容器
  # 共享其网络命名空间（compose-patterns 的 distroless healthcheck 模式）。
  minio-health:
    image: curlimages/curl:8.12.1
    network_mode: "service:minio"
    entrypoint: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      minio:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  minio-init:
    # 幂等创建业务桶（--ignore-existing），成功即退出。alias 经 MC_HOST_ 环境变量注入。
    image: cgr.dev/chainguard/minio-client@sha256:895a0ce9979bff02df49224f26ec3fd15777987b591d4324986de9727ac53d59
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/dom-assets"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:? 缺少 MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD:? 缺少 MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      minio-health:
        condition: service_healthy
    restart: "on-failure:10"
    logging: *default-logging

  migrate:
    # 生产数据库唯一迁移工具 Alembic（doc 26 §25）；重复执行幂等。
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    command: ["alembic", "-c", "migrations/postgres/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dom}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure:10"
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dom}
      VALKEY_URL: redis://valkey:6379/14
      NATS_URL: nats://nats:4222
      CONTRACTS_DIR: /app/contracts
      # 邮件：默认 logging（验证码写日志，开箱即用）；要真实发信设 MAILER_PROVIDER=smtp + SMTP_*。
      MAILER_PROVIDER: ${MAILER_PROVIDER:-logging}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-1}
      MAIL_LINK_BASE_URL: ${MAIL_LINK_BASE_URL:? 缺少 MAIL_LINK_BASE_URL（initialize-env.sh 会写入 https://<公网IP>）}
      INVITATION_IDEMPOTENCY_ENCRYPTION_KEY: ${INVITATION_IDEMPOTENCY_ENCRYPTION_KEY:? 缺少 INVITATION_IDEMPOTENCY_ENCRYPTION_KEY}
      SHARE_LINK_IDEMPOTENCY_ENCRYPTION_KEY: ${SHARE_LINK_IDEMPOTENCY_ENCRYPTION_KEY:? 缺少 SHARE_LINK_IDEMPOTENCY_ENCRYPTION_KEY}
      S3_ASSET_ENDPOINT: http://minio:9000
      S3_ASSET_REGION: us-east-1
      S3_ASSET_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_ASSET_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ASSET_BUCKET: dom-assets
      S3_ASSET_ADDRESSING_STYLE: path
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    environment:
      REALTIME_PORT: "8765"
      REALTIME_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dom}
      # 与 API 共享同一 Valkey 实例：db14 会话缓存，db15 Yjs backlog / presence。
      VALKEY_URL: redis://valkey:6379/14
      REDIS_BACKLOG_URL: redis://valkey:6379/15
      NATS_URL: nats://nats:4222
      REALTIME_API_BASE_URL: http://api:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  maintenance-worker:
    build:
      context: .
      dockerfile: workers/maintenance/Dockerfile
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dom}
      NATS_URL: nats://nats:4222
      S3_ASSET_ENDPOINT: http://minio:9000
      S3_ASSET_REGION: us-east-1
      S3_ASSET_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_ASSET_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ASSET_BUCKET: dom-assets
      S3_ASSET_ADDRESSING_STYLE: path
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # 公网入口：TLS 终止 + HTTP->HTTPS + ACME 验证路径；内部转发 web:8080。
  gateway:
    image: nginx:stable-alpine
    entrypoint: ["/bin/sh", "/opt/dom/deploy/start-gateway.sh"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:? 缺少 PUBLIC_IP：先运行 scripts/deploy-aliyun/initialize-env.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/deploy-aliyun:/opt/dom/deploy:ro
      - acme-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - nginx-run:/run
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # 短期 IP 证书（Let's Encrypt，约 6 天有效期）：每 6 小时签发/续期循环；
  # 与 gateway 共享 PID namespace 以执行 reload（kill -HUP nginx master）。
  certbot:
    image: certbot/certbot:v5.8.0
    entrypoint: ["/bin/sh", "/opt/dom/deploy/certbot-loop.sh"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:? 缺少 PUBLIC_IP：先运行 scripts/deploy-aliyun/initialize-env.sh}
    volumes:
      - ./scripts/deploy-aliyun:/opt/dom/deploy:ro
      - acme-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - certbot-lib:/var/lib/letsencrypt
      - certbot-log:/var/log/letsencrypt
      - nginx-run:/run
    pid: service:gateway
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata: {}
  natsdata: {}
  miniodata: {}
  acme-webroot: {}
  letsencrypt: {}
  certbot-lib: {}
  certbot-log: {}
  nginx-run: {}