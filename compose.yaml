# DOM dev-stack orchestration (docs/architecture/15 §2 local model).
# Mirrors the harness topology: Postgres 16 (:5432), Valkey (:6379), NATS
# JetStream (:4222). Healthchecks gate each service.
name: dom
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torch
      POSTGRES_DB: dom_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torch -d dom_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "''"]
    ports:
      - "6379:6379"
    volumes:
      - vkdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
  maintenance-worker:
    build:
      context: .
      dockerfile: workers/maintenance/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://torch@postgres:5432/dom_dev
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "workers.maintenance.main", "--daemon", "--interval", "5"]
    restart: unless-stopped
volumes:
  pgdata: {}
  vkdata: {}
