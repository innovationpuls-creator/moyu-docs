name: dom-server

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dom_app}
      POSTGRES_DB: ${POSTGRES_DB:-dom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dom_app} -d ${POSTGRES_DB:-dom}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?Run scripts/package-tencent-cvm.sh to generate server credentials}:${MINIO_ROOT_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}@minio:9000
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/dom-assets"]
    restart: "on-failure:10"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  valkey:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: dom-server-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["alembic", "-c", "migrations/postgres/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dom_app}:${POSTGRES_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}@postgres:5432/${POSTGRES_DB:-dom}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure:5"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: dom-server-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dom_app}:${POSTGRES_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}@postgres:5432/${POSTGRES_DB:-dom}
      VALKEY_URL: redis://valkey:6379/14
      NATS_URL: nats://nats:4222
      CONTRACTS_DIR: /app/contracts
      MAILER_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-1}
      MAIL_LINK_BASE_URL: ${MAIL_LINK_BASE_URL:-http://localhost}
      INVITATION_IDEMPOTENCY_ENCRYPTION_KEY: ${INVITATION_IDEMPOTENCY_ENCRYPTION_KEY:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      SHARE_LINK_IDEMPOTENCY_ENCRYPTION_KEY: ${SHARE_LINK_IDEMPOTENCY_ENCRYPTION_KEY:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      S3_ASSET_ENDPOINT: http://minio:9000
      S3_ASSET_REGION: us-east-1
      S3_ASSET_ACCESS_KEY: ${MINIO_ROOT_USER:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      S3_ASSET_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      S3_ASSET_BUCKET: dom-assets
      S3_ASSET_ADDRESSING_STYLE: path
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    environment:
      PORT: "8765"
      REALTIME_DATABASE_URL: postgresql://${POSTGRES_USER:-dom_app}:${POSTGRES_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}@postgres:5432/${POSTGRES_DB:-dom}
      VALKEY_URL: redis://valkey:6379/14
      NATS_URL: nats://nats:4222
      REALTIME_API_BASE_URL: http://api:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  maintenance-worker:
    build:
      context: .
      dockerfile: workers/maintenance/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dom_app}:${POSTGRES_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}@postgres:5432/${POSTGRES_DB:-dom}
      S3_ASSET_ENDPOINT: http://minio:9000
      S3_ASSET_REGION: us-east-1
      S3_ASSET_ACCESS_KEY: ${MINIO_ROOT_USER:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      S3_ASSET_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/package-tencent-cvm.sh to generate server credentials}
      S3_ASSET_BUCKET: dom-assets
      S3_ASSET_ADDRESSING_STYLE: path
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      default: {}
      onetree-edge:
        aliases:
          - dom-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata: {}
  natsdata: {}
  miniodata: {}

networks:
  default: {}
  onetree-edge:
    external: true
    name: deploy_default
