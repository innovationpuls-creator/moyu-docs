[project]
name = "api-service"
version = "0.1.0"
description = "DOM HTTP API service (FastAPI application boundary, doc 27 §17)."
requires-python = ">=3.12"
dependencies = [
    "app-core",
    "app-infrastructure",
    "app-contracts",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "redis>=5.0.4",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]