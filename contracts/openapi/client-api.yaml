openapi: 3.1.0
info:
  title: DOM Client API
  version: 1.0.0
  description: >
    Official client HTTP contract for Account/Auth/Session and Workspace/Project/Folder
    metadata lifecycle (docs 09 and 28). This document describes only the HTTP surface:
    routes, operationId, headers and error-response assembly. Payload shapes are
    referenced from canonical JSON Schemas under /contracts and are never restated
    inline; code generation is driven by contracts/registry.yaml, not paths.
servers:
  - url: https://api.dom.internal
    description: Production
components:
  responses:
    ErrorEnvelopeResponse:
      description: Canonical error envelope (doc 28 §29)
      content:
        application/json:
          schema:
            $ref: "../errors/error-envelope.schema.json"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for safe retry of a logical mutating command (doc 28 §13)
      schema:
        type: string
        format: uuid
paths:
  /v1/auth/register:
    post:
      operationId: RegisterWithEmail
      summary: Register a new account with email + password (FR-AUTH-001)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/auth/register-with-email.schema.json"
      responses:
        "200":
          description: Account created (anti-enumeration uniform payload)
          headers:
            Set-Cookie:
              description: Secure; HttpOnly session cookie for the auto-established session
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "../commands/auth/register-with-email.schema.json#/$defs/RegisterWithEmailResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "409":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "429":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/auth/verify-email:
    post:
      operationId: VerifyEmail
      summary: Verify email via single-use token (FR-AUTH-002)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/auth/verify-email.schema.json"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "../commands/auth/verify-email.schema.json#/$defs/VerifyEmailResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/resend-verification:
    post:
      operationId: ResendEmailVerification
      summary: Resend email verification (FR-AUTH-004)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/auth/resend-email-verification.schema.json"
      responses:
        "200":
          description: Resend accepted (uniform, no account-existence leak)
          content:
            application/json:
              schema:
                $ref: "../commands/auth/resend-email-verification.schema.json#/$defs/ResendEmailVerificationResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "429":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/login:
    post:
      operationId: LoginWithPassword
      summary: Login with email + password (FR-AUTH-006)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/auth/login-with-password.schema.json"
      responses:
        "200":
          description: Login succeeded; session summary returned
          headers:
            Set-Cookie:
              description: Secure; HttpOnly session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "../commands/auth/login-with-password.schema.json#/$defs/LoginWithPasswordResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "429":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/auth/logout:
    post:
      operationId: Logout
      summary: Logout current device session (FR-AUTH-020, no request body)
      tags: [auth]
      responses:
        "200":
          description: Logged out (idempotent)
          content:
            application/json:
              schema:
                $ref: "../commands/auth/logout.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/me:
    get:
      operationId: GetCurrentAccount
      summary: Get the actor's own account (FR-AUTH-022)
      tags: [auth]
      responses:
        "200":
          description: Current account facts
          content:
            application/json:
              schema:
                $ref: "../queries/auth/get-current-account.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/session:
    get:
      operationId: GetCurrentSession
      summary: Get the current device session (FR-AUTH-022)
      tags: [auth]
      responses:
        "200":
          description: Current session facts
          content:
            application/json:
              schema:
                $ref: "../queries/auth/get-current-session.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/forgot-password:
    post:
      operationId: RequestPasswordReset
      summary: Request password reset (FR-AUTH-024)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/auth/request-password-reset.schema.json"
      responses:
        "200":
          description: Reset request accepted (uniform, no account-existence leak)
          content:
            application/json:
              schema:
                $ref: "../commands/auth/request-password-reset.schema.json#/$defs/RequestPasswordResetResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "429":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/reset-password:
    post:
      operationId: ResetPassword
      summary: Reset password with single-use token (FR-AUTH-025)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/auth/reset-password.schema.json"
      responses:
        "200":
          description: Password reset succeeded
          content:
            application/json:
              schema:
                $ref: "../commands/auth/reset-password.schema.json#/$defs/ResetPasswordResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/reauthenticate:
    post:
      operationId: Reauthenticate
      summary: Re-verify password for recent authentication (FR-AUTH-034)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/auth/reauthenticate.schema.json"
      responses:
        "200":
          description: Re-authentication window established
          content:
            application/json:
              schema:
                $ref: "../commands/auth/reauthenticate.schema.json#/$defs/ReauthenticateResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/delete-account:
    post:
      operationId: RequestAccountDeletion
      summary: Request account deletion (FR-AUTH-029/030, no request body)
      tags: [auth]
      responses:
        "200":
          description: Deletion requested; 30-day grace period started
          content:
            application/json:
              schema:
                $ref: "../commands/auth/request-account-deletion.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "409":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/auth/cancel-delete-account:
    post:
      operationId: CancelAccountDeletion
      summary: Cancel a pending account deletion (FR-AUTH-031, no request body)
      tags: [auth]
      responses:
        "200":
          description: Deletion cancelled; status restored
          content:
            application/json:
              schema:
                $ref: "../commands/auth/cancel-account-deletion.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "409":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/auth/status:
    get:
      operationId: GetAccountStatus
      summary: Get the actor's account lifecycle status and deletion window (FR-AUTH-030/032)
      description: >
        Client Query of the Account Recovery Mode view (deletion state, remaining grace
        period, scheduled final deletion). Registered in contracts/registry.yaml and
        projected in both language contract packages; the route described here is the
        HTTP surface for the existing Client Query.
      tags: [auth]
      responses:
        "200":
          description: Account status
          content:
            application/json:
              schema:
                $ref: "../queries/auth/get-account-status.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/resources:
    post:
      operationId: CreateResource
      summary: Create a Resource in an authorized Project (FR-RC-001)
      tags: [resource]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/resource/create-resource.schema.json"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "../commands/resource/create-resource.schema.json#/$defs/CreateResourceResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "409":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/resources/{resourceId}/journal:
    post:
      operationId: AppendJournalOp
      summary: Append one content op to a Resource journal (FR-RC-002)
      tags: [resource]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/resource/append-journal-op.schema.json"
      responses:
        "200":
          description: Op appended
          content:
            application/json:
              schema:
                $ref: "../commands/resource/append-journal-op.schema.json#/$defs/AppendJournalOpResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "409":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/ai/propose-changeset:
    post:
      operationId: ProposeChangeSet
      summary: Propose a reviewable AI ChangeSet without applying it
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/ai/propose-changeset.schema.json"
      responses:
        "200":
          description: Proposed ChangeSet
          content:
            application/json:
              schema:
                $ref: "../commands/ai/propose-changeset.schema.json#/$defs/ProposeChangeSetResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/changesets/{changesetId}/apply:
    post:
      operationId: ApplyChangeSet
      summary: Apply a ChangeSet after explicit user approval
      tags: [ai]
      parameters:
        - name: changesetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Applied ChangeSet
          content:
            application/json:
              schema:
                $ref: "../commands/ai/apply-changeset.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/resources/{resourceId}:
    get:
      operationId: OpenResource
      summary: Open a Resource's metadata and latest snapshot (FR-RC-001/006)
      tags: [resource]
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resource metadata + latest materialized snapshot
          content:
            application/json:
              schema:
                $ref: "../queries/resource/open-resource.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
    patch:
      operationId: RenameResource
      summary: Rename an authorized Resource (FR-RC-004)
      tags: [resource]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/resource/rename-resource.schema.json"
      responses:
        "200":
          description: Resource renamed
          content:
            application/json:
              schema:
                $ref: "../commands/resource/rename-resource.schema.json#/$defs/RenameResourceResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "409":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/resources/{resourceId}/restore:
    post:
      operationId: RestoreResource
      summary: Restore a Trashed Resource to Active (FR-RC-005)
      tags: [resource]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/resource/restore-resource.schema.json"
      responses:
        "200":
          description: Resource restored
          content:
            application/json:
              schema:
                $ref: "../commands/resource/restore-resource.schema.json#/$defs/RestoreResourceResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/resources/{resourceId}/export:
    get:
      operationId: ExportResource
      summary: Export one Resource as a versioned exchange document (FR-IE-001)
      tags: [importexport]
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Exchange document
          content:
            application/json:
              schema:
                $ref: "../queries/importexport/export-resource.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/resources/{resourceId}/import:
    post:
      operationId: ImportResource
      summary: Import an exchange document into a Resource (FR-IE-002)
      tags: [importexport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/importexport/import-resource.schema.json"
      responses:
        "200":
          description: Imported as a new checkpoint
          content:
            application/json:
              schema:
                $ref: "../commands/importexport/import-resource.schema.json#/$defs/ImportResourceResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/comments/{commentId}:
    patch:
      operationId: EditComment
      summary: Author edits their comment body (FR-CMT-003)
      tags: [comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/comments/edit-comment.schema.json"
      responses:
        "200":
          description: Comment edited
          content:
            application/json:
              schema:
                $ref: "../commands/comments/edit-comment.schema.json#/$defs/EditCommentResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
    delete:
      operationId: DeleteComment
      summary: Author soft-deletes their comment (FR-CMT-004)
      tags: [comments]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: "../commands/comments/delete-comment.schema.json#/$defs/DeleteCommentResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/resources/{resourceId}/comments:
    post:
      operationId: AddComment
      summary: Append one flat-thread comment to a Resource (FR-CMT-001)
      tags: [comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/comments/add-comment.schema.json"
      responses:
        "201":
          description: Comment appended
          content:
            application/json:
              schema:
                $ref: "../commands/comments/add-comment.schema.json#/$defs/AddCommentResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
    get:
      operationId: ListComments
      summary: List flat-thread comments of a Resource (FR-CMT-002)
      tags: [comments]
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comments oldest-first
          content:
            application/json:
              schema:
                $ref: "../queries/comments/list-comments.schema.json"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ErrorEnvelopeResponse"

  /v1/resources/{resourceId}/versions:
    post:
      operationId: CreateNamedVersion
      summary: Label a revision for later restore (FR-HS-003)
      tags: [history]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/history/create-named-version.schema.json"
      responses:
        "200":
          description: Version labeled
          content:
            application/json:
              schema:
                $ref: "../commands/history/create-named-version.schema.json#/$defs/CreateNamedVersionResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "409":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"

  /v1/resources/{resourceId}/history:
    get:
      operationId: ListVersions
      summary: Version timeline (FR-HS-001)
      tags: [history]
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Timeline nodes oldest-first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  resourceId:
                    type: string
                    format: uuid
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        seq: { "type": "integer" }
                        kind: { "type": "string" }
                        label: { "type": ["string", "null"] }
                        author: { "type": ["string", "null"] }
                        occurredAt: { "type": ["string", "null"] }
                      required: [seq, kind, label, author, occurredAt]
                required: [resourceId, items]
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
    post:
      operationId: RestoreVersion
      summary: Restore at a version = a NEW current (FR-HS-002)
      tags: [history]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                baseJournalSeq: { "type": "integer" }
              required: [baseJournalSeq]
      responses:
        "200":
          description: Restored as the new current
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  resourceId: { "type": "string", "format": "uuid" }
                  newSeq: { "type": "integer" }
                  label: { "type": "string" }
                required: [resourceId, newSeq, label]
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid

  /v1/resources/{resourceId}/trash:
    post:
      operationId: TrashResource
      summary: Move an authorized Resource to Trashed (FR-RC-005)
      tags: [resource]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../commands/resource/trash-resource.schema.json"
      responses:
        "200":
          description: Resource trashed
          content:
            application/json:
              schema:
                $ref: "../commands/resource/trash-resource.schema.json#/$defs/TrashResourceResponse"
        "400":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "401":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "403":
          $ref: "#/components/responses/ErrorEnvelopeResponse"
        "404":
