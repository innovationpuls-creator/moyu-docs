    requestRef: contracts/commands/auth/resend-email-verification.schema.json
    responseRef: contracts/commands/auth/resend-email-verification.schema.json#/$defs/ResendEmailVerificationResponse
    permissionCapability: none
    authRequirement: Public
    idempotencyRequirement: none
    errorCodes: [RATE_LIMITED, EMAIL_INVALID]
    ownerDocument: docs/architecture/16-Account-Auth-Session-Design.md
    ownerModule: packages/py/core/account
    status: active

  - logicalName: LoginWithPassword
    kind: Command
    domain: auth
    version: "1.0.0"
    schemaPath: contracts/commands/auth/login-with-password.schema.json
    requestRef: contracts/commands/auth/login-with-password.schema.json
    responseRef: contracts/commands/auth/login-with-password.schema.json#/$defs/LoginWithPasswordResponse
    permissionCapability: none
    authRequirement: Public
    idempotencyRequirement: required
    errorCodes: [INVALID_CREDENTIALS, ACCOUNT_DISABLED, RATE_LIMITED, IDEMPOTENCY_KEY_CONFLICT]
    ownerDocument: docs/architecture/16-Account-Auth-Session-Design.md
    ownerModule: packages/py/core/session
    status: active

  - logicalName: Logout
    kind: Command
    domain: auth
    version: "1.0.0"
    schemaPath: contracts/commands/auth/logout.schema.json
    requestRef: contracts/commands/auth/logout.schema.json
    responseRef: contracts/commands/auth/logout.schema.json#/$defs/LogoutResponse
    permissionCapability: none
    authRequirement: Authenticated
    idempotencyRequirement: none
    errorCodes: [SESSION_EXPIRED, SESSION_REPLACED, ACCOUNT_DISABLED]
    ownerDocument: docs/architecture/16-Account-Auth-Session-Design.md
    ownerModule: packages/py/core/session
    status: active

  - logicalName: Reauthenticate
    kind: Command
    domain: auth
    version: "1.0.0"
    schemaPath: contracts/commands/auth/reauthenticate.schema.json
    requestRef: contracts/commands/auth/reauthenticate.schema.json
    responseRef: contracts/commands/auth/reauthenticate.schema.json#/$defs/ReauthenticateResponse
    permissionCapability: none
    authRequirement: Authenticated
    idempotencyRequirement: none
    # Reauthenticate IS the mechanism that satisfies recent authentication, so
    # RECENT_AUTHENTICATION_REQUIRED is unreachable from it; the session-bound codes
    # apply because the request is Authenticated, and RATE_LIMITED because PRD AC-034.3
    # rate-limits repeated re-auth failures.
    errorCodes: [INVALID_CREDENTIALS, SESSION_EXPIRED, SESSION_REPLACED, ACCOUNT_DISABLED, RATE_LIMITED]
    ownerDocument: docs/architecture/16-Account-Auth-Session-Design.md
    ownerModule: packages/py/core/session
    status: active

