# Contract Schema Registry (doc 28 §8)
#
# 本文件是代码生成的根输入：generator 遍历本文件注册的每一条 Contract，按其
# schemaPath 读取 Canonical JSON Schema 并生成语言投影，不以 OpenAPI paths 是否
# 引用某条 Contract 作为判据（doc 28 §2.1）。因此任何 kind 的 Contract 都必然
# 存在正式投影，包括不承载 HTTP Route 的 Event。
#
# kind 取值：Command / Query / Event / Error / Identity。Error 与 Identity 与其余
# 三类同级 —— 错误信封与 Canonical ID 类型同样是跨模块机器契约。
#
# permissionCapability 一律为 none：Auth 边界操作不受 doc 07 的 Resource /
# Workspace Capability 管辖（doc 16 §66、Constitution §3.36-§3.37）。会话边界改由
# authRequirement 表达：Public / Authenticated / RecentAuthentication
# （doc 16 §104-§105、PRD FR-AUTH-034）。仅 Command / Query 适用。
#
# requestBody 表达请求体存在性（doc 28 §8）：
#   required -> schema 文件 root 为请求，响应位于 $defs.<LogicalName>Response
#   none     -> 客户端不发送请求体，OpenAPI 不声明 requestBody，schema 文件 root
#               即响应，因此生成物中只存在 Response 类型，不存在占位请求模型
#
# logicalName 与 docs/architecture/16-Account-Auth-Session-Design.md §84-§85 的
# Canonical Command / Query 名单一一对应。
#
# ownerModule：account 拥有 Account 生命周期，session 拥有 Session 生命周期
# （doc 27 §26）。

