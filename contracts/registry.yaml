# Contract Schema Registry (doc 28 §8).
#
# One entry per machine-readable contract. Per doc 28 §8/§16/§19 each Command/Query
# entry carries requestRef + responseRef (machine-readable pointers into its canonical
# JSON Schema), permissionCapability, idempotencyRequirement and errorCodes. Events
# carry eventSubject in the doc 28 §25 format.
#
# KIND VOCABULARY NOTE: doc 28 §8 lists Command/Query/Event/Stream/Task/Error/Stream...
# (§1) and the registry field list (§8) only names Command/Query/Event. This registry
# additionally registers `Error` (ErrorEnvelope) and `Identity` (IdentityIds) kinds.
# §9 mandates ID-type registration and the plan fixes ErrorEnvelope as kind `Error`,
# so the vocabulary is deliberately widened beyond §8's list. This is documented here
# rather than silently; `kind` allowed values = Command, Query, Event, Error, Identity.
#
# OWNERMODULE CONTRADICTION RESOLUTION: the plan's draft registry.yaml placed
# LoginWithEmail under packages/py/core/account, but the plan's Task 14 places the login
# use case under packages/py/core/session. Per the task instructions we resolve this as
# stated: session-lifecycle contracts (LoginWithPassword, Logout, Reauthenticate,
# SessionReplaced, GetCurrentSession) -> packages/py/core/session; account-lifecycle
# contracts (the rest) -> packages/py/core/account. Flagged in the task report.
#
# PERMISSION / AUTH-BOUNDARY NOTE (FIX-6): every auth contract sets
# `permissionCapability: none`, i.e. "not gated by a doc 07 resource/workspace Capability
# — this is an Auth-boundary operation". doc 07 (§66) defines NO Capability for an auth
# entry point and Constitution §3.36-§3.37 keep Auth and Permission separate, so the
# formerly-invented `account:self` value is removed. The companion `authRequirement`
# field records the auth boundary each operation requires, derived from doc 16 §104-§105
# and PRD FR-AUTH-034: `Public` (unauthenticated entry point), `Authenticated` (a valid
# session is required), `RecentAuthentication` (re-auth within the 10-minute window,
# PRD FR-AUTH-029/034). Event contracts are recorded as `Authenticated` because they are
# emitted inside an authenticated session lifecycle.
#
# IDENTITY IDS NOTE (FIX-7): the `IdentityIds` registry entry is the single logical name
# that covers BOTH the canonical ID types (doc 28 §9-§11) AND the shared cross-contract
# value enums (AccountStatusValue / SessionStatusValue / SessionReplacementReason)
# co-located in contracts/ids/ids.schema.json. doc 27 §52 freezes no directory for shared
# enums, so co-location is a deliberate choice; the registry name therefore spans both
# groups and is not renamed.

version: "1.0.0"

contracts:
  - logicalName: RegisterWithEmail
    kind: Command
    domain: auth
    version: "1.0.0"
    schemaPath: contracts/commands/auth/register-with-email.schema.json
    requestRef: contracts/commands/auth/register-with-email.schema.json
    responseRef: contracts/commands/auth/register-with-email.schema.json#/$defs/RegisterWithEmailResponse
    permissionCapability: none
    authRequirement: Public
    idempotencyRequirement: required
    errorCodes: [PASSWORD_TOO_WEAK, EMAIL_INVALID, RATE_LIMITED, IDEMPOTENCY_KEY_CONFLICT]
    ownerDocument: docs/architecture/16-Account-Auth-Session-Design.md
    ownerModule: packages/py/core/account
    status: active

  - logicalName: VerifyEmail
    kind: Command
    domain: auth
    version: "1.0.0"
    schemaPath: contracts/commands/auth/verify-email.schema.json
    requestRef: contracts/commands/auth/verify-email.schema.json
    responseRef: contracts/commands/auth/verify-email.schema.json#/$defs/VerifyEmailResponse
    permissionCapability: none
    authRequirement: Public
    idempotencyRequirement: none
    errorCodes: [EMAIL_VERIFICATION_TOKEN_INVALID, ACCOUNT_DISABLED]
    ownerDocument: docs/architecture/16-Account-Auth-Session-Design.md
    ownerModule: packages/py/core/account
    status: active

  - logicalName: ResendEmailVerification
