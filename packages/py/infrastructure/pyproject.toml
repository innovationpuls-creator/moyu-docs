[project]
name = "app-infrastructure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "app-contracts",
    "app-core",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.4",
    "nats-py>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_infra"]
