[project]
name = "task-runtime"
version = "0.1.0"
description = "Framework-independent generic async task runtime."
requires-python = ">=3.12"
dependencies = [
    "app-core",
    "opentelemetry-api>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"src/task_runtime/py.typed" = "task_runtime/py.typed"
