[project]
name = "app-core"
version = "0.1.0"
description = "Framework-independent domain and application core."
requires-python = ">=3.12"
dependencies = [
    "app-contracts",
    "argon2-cffi>=23.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_core"]
