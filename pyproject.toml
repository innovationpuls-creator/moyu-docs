[project]
name = "dom"
version = "0.1.0"
description = "墨屿 Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "opentelemetry-api>=1.25.0",
    "cryptography>=42.0.0",
    # 生成物（Task 3 产出）：契约的 Python 投影，测试与 lint 依赖其强类型（doc 27 §17/§53）。
    "app-contracts",
    "app-core",
    "app-infrastructure",
    # API 边界（Task 20/21 产出）：services/api 的测试与类型检查需要其可导入。
    "api-service",
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
    "mypy>=1.10",
    "openapi-spec-validator>=0.7",
    "datamodel-code-generator>=0.25",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pytest-bdd>=8.1.0",
]

[tool.uv.workspace]
# 仅保留当前可解析的成员；packages/py/* 在 Task 3 会纳入 packages/py/contracts
members = [
    "packages/py/*",
    "services/api",
]

[tool.uv.sources]
# app-contracts 是 workspace 成员，dev 依赖引用需显式声明来源（uv 要求）
app-contracts = { workspace = true }
app-core = { workspace = true }
app-infrastructure = { workspace = true }
api-service = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
testpaths = [
    "tests",
    "packages/py",
    "services/api",
]
# pytest-bdd 8.x maps Gherkin feature tags to pytest markers; --strict-markers
# requires every tag used by the tests/bdd feature file to be registered.
# `browser` routes the 9 browser-semantic scenarios (FR-AUTH-013/016/017/019/
# 021) to the Playwright suite (plan Task 30); tests/bdd/conftest.py deselects
# them so plain `pytest tests/bdd/...` runs the 55 backend scenarios.
markers = [
    "browser: 9 browser-semantic scenarios (multi-tab device session, WS disconnect, SessionReplaced UI, local-unsynced protection x3, refresh/restart recovery x2) — Playwright, plan Task 30",
    "FR-AUTH-001: BDD scenario tag (registration validation)",
    "FR-AUTH-002: BDD scenario tag (email verification)",
    "FR-AUTH-003: BDD scenario tag (PendingVerification workspace capability)",
    "FR-AUTH-004: BDD scenario tag (verification resend rate limiting)",
    "FR-AUTH-005: BDD scenario tag (registration uniqueness / anti-enumeration)",
    "FR-AUTH-006: BDD scenario tag (email+password login)",
    "FR-AUTH-007: BDD scenario tag (auth entry-point anti-enumeration)",
    "FR-AUTH-008: BDD scenario tag (session credential rotation)",
    "FR-AUTH-009: BDD scenario tag (idle / absolute session expiry)",
    "FR-AUTH-010: BDD scenario tag (server-side session revocation)",
    "FR-AUTH-011: BDD scenario tag (two-device session quota)",
    "FR-AUTH-012: BDD scenario tag (third-device replacement by createdAt)",
    "FR-AUTH-013: BDD scenario tag (multi-tab shared device session)",
    "FR-AUTH-014: BDD scenario tag (concurrent login convergence)",
    "FR-AUTH-015: BDD scenario tag (replaced session rejection)",
    "FR-AUTH-016: BDD scenario tag (realtime disconnect on replacement)",
    "FR-AUTH-017: BDD scenario tag (SessionReplaced user-visible UI)",
    "FR-AUTH-018: BDD scenario tag (newer device unaffected by replacement)",
    "FR-AUTH-019: BDD scenario tag (local unsynced content protection)",
    "FR-AUTH-020: BDD scenario tag (logout semantics / idempotency)",
    "FR-AUTH-021: BDD scenario tag (refresh / restart session recovery)",
    "FR-AUTH-022: BDD scenario tag (current account/session queries)",
    "FR-AUTH-023: BDD scenario tag (server-authoritative capability checks)",
    "FR-AUTH-024: BDD scenario tag (forgot-password anti-enumeration)",
    "FR-AUTH-025: BDD scenario tag (password reset tokens)",
    "FR-AUTH-026: BDD scenario tag (reset revokes sessions)",
    "FR-AUTH-027: BDD scenario tag (reset does not create a session)",
    "FR-AUTH-028: BDD scenario tag (reset token replay rejection)",
    "FR-AUTH-029: BDD scenario tag (account deletion request)",
    "FR-AUTH-030: BDD scenario tag (deletion grace period / purge)",
    "FR-AUTH-031: BDD scenario tag (cancel deletion restore)",
    "FR-AUTH-032: BDD scenario tag (Account Recovery Mode)",
    "FR-AUTH-033: BDD scenario tag (deleted account resources preserved)",
    "FR-AUTH-034: BDD scenario tag (recent reauthentication window)",
    "FR-AUTH-035: BDD scenario tag (login lockout)",
    "FR-AUTH-036: BDD scenario tag (session replacement security notice)",
    "FR-AUTH-037: BDD scenario tag (audit logging)",
]

[tool.mypy]
python_version = "3.12"
mypy_path = [
    "packages/py/task-runtime/src",
    "packages/py/core/src",
    "packages/py/infrastructure/src",
]
# 当前阶段仅 scripts/tests 存在；packages、services 在后续 Task 创建后由其自身 pyproject 纳入。
# 注：早期将不存在的目录列入 files 会触发 mypy 模块映射异常（duplicate __main__），
# 故此处仅覆盖当前已存在的源码目录。
files = [
    "scripts",
    "tests",
    "services/api/src",
    "packages/py/core/src",
    "packages/py/infrastructure/src",
    "packages/py/task-runtime/src",
    "workers",
]
# 生成物（Task 3 产出）为机器生成代码，禁止手改，mypy 跳过
exclude = [
    "packages/py/contracts/src/app_contracts",
    # tests/security 与 tests/integration 的 conftest.py 直接 import 已安装的
    # api 服务（无 py.typed，与 services/api/tests/conftest.py 同因）；且两个
    # 目录的 conftest 同名会触发 mypy duplicate-module 错误，故按 services/api
    # 惯例排除 conftest 本身，保留对测试用例文件的检查。
    "tests/security/conftest.py",
    "tests/integration/conftest.py",
    # tests/bdd 的 conftest.py 同理直接 import 无 py.typed 的 api 服务
    "tests/bdd/conftest.py",
    # tests/bdd 其余文件是 pytest-bdd 测试脚手架（step 注册约定使 pytest 以
    # 顶层模块与 tests.bdd.step_defs 包路径双名导入步骤文件，触发 mypy 同名
    # 模块冲突；步骤大量索引 Optional 响应体）。按上述 conftest 惯例，整个
    # tests/bdd 目录排除在 mypy 之外。
    "tests/bdd",
]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
ignore_missing_imports = false

[tool.ruff]
# 限制单行长度，超出则由 Ruff Formatter 自动在合适的位置折行排版
line-length = 88
# 匹配当前 Python 的运行版本（与 .python-version 及 docs/architecture/26 §19 严格对齐）
target-version = "py312"

[tool.ruff.lint]
# 激活的核心规则：
# E/W: 基础语法与 PEP8 规范检查
# F: 核心错误检查（包含 F401-未使用导入, F841-未使用变量）
# I: isort 导入自动排序（把包按字母顺序排好）
# C90: 检查单个函数的复杂度，防止写出过度嵌套的逻辑
select = ["E", "W", "F", "I", "C90"]

# 允许自动修复所有可安全修复的规则项
fixable = ["ALL"]
unfixable = []

# 生成物（Task 3 产出）为机器生成代码，禁止手改；其长字符串字面量（如
# error-envelope 的 details 描述，doc 28 §31）触发 E501 且 ruff format 无法折行，
# 故对该目录仅忽略 E501，与 [tool.mypy] 的 exclude 保持一致。
[tool.ruff.lint.per-file-ignores]
"packages/py/contracts/src/app_contracts/**" = ["E501"]
